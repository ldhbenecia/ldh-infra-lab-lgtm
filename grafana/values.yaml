# Grafana 차트 (grafana-community/helm-charts 14.0.1, Grafana 13.2.4)
# 원칙: Grafana 는 상태를 갖지 않는다 (stateless)
#   데이터소스·대시보드는 전부 Git 에서 프로비저닝 → 파드를 지워도 그대로 다시 생김
#   그래서 PVC 없음. UI 에서 손으로 만든 대시보드는 재시작하면 사라진다 → JSON 으로 Git 에 넣는다

# ── 로그인 ───────────────────────────────────────────────────────────
admin:
  existingSecret: grafana-admin       # SealedSecret 에서 풀린 Secret
  userKey: admin-user
  passwordKey: admin-password

# ── 저장 안 함 ───────────────────────────────────────────────────────
persistence:
  enabled: false

# ── 권한: 이 ns 안에서만 ─────────────────────────────────────────────
# 기본값(namespaced: false)이면 ClusterRole 을 만든다 → AppProject 가 거부
# 클러스터 전체를 볼 일(사이드카로 다른 ns 의 대시보드 ConfigMap 읽기)이 생기면 그때 바꾼다
rbac:
  namespaced: true

# helm test 용 파드. ArgoCD 는 어차피 건너뛰지만 명시적으로 끔
testFramework:
  enabled: false

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits:   { memory: 512Mi }

# ── 접속 주소 ────────────────────────────────────────────────────────
ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - grafana.lab.local

grafana.ini:
  server:
    root_url: http://grafana.lab.local
  analytics:
    reporting_enabled: false          # Grafana 로 사용 통계 전송 끔
    check_for_updates: false
  users:
    allow_sign_up: false

# ── 데이터소스 (프로비저닝) ──────────────────────────────────────────
# 테넌트마다 하나. 같은 Mimir 를 보지만 X-Scope-OrgID 헤더가 달라서 서로의 데이터가 안 보인다
# 주소: mimir-gateway(Service 이름) . monitoring(ns) . svc : 80  →  /prometheus (읽기 경로)
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Mimir (msa)
        uid: mimir-msa                # 대시보드 JSON 이 이 uid 로 데이터소스를 가리킴
        type: prometheus              # Mimir 는 Prometheus API 와 호환
        access: proxy                 # 브라우저가 아니라 Grafana 서버가 대신 요청
        url: http://mimir-gateway.monitoring.svc/prometheus
        isDefault: true
        jsonData:
          prometheusType: Mimir
          timeInterval: 30s           # 수집 간격과 맞춤 (rate 범위 계산 기준)
          httpHeaderName1: X-Scope-OrgID
        secureJsonData:
          httpHeaderValue1: msa
      - name: Mimir (morris)
        uid: mimir-morris
        type: prometheus
        access: proxy
        url: http://mimir-gateway.monitoring.svc/prometheus
        jsonData:
          prometheusType: Mimir
          timeInterval: 30s
          httpHeaderName1: X-Scope-OrgID
        secureJsonData:
          httpHeaderValue1: morris
